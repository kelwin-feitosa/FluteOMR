# Updates are proposed as PRs; merging is always manual.
# Python versions are pinned in pyproject.toml AND requirements-dev.lock,
# so automated pip changes are intentionally deferred until both are updated together.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      routine-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
