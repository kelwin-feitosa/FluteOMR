# Checks declared, pinned packages for known advisories; never applies fixes.
name: Python dependency advisory audit
on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'requirements-dev.lock'
      - '.github/workflows/dependency-audit.yml'
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'requirements-dev.lock'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '29 8 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit tool in CI only
        run: python -m pip install 'pip-audit>=2,<3'
      - name: Check known vulnerabilities in pinned dependencies
        run: python -m pip_audit --no-deps -r requirements-dev.lock --progress-spinner off
