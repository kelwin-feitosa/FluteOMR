name: TEMPORARY — Ruff formatter for Missão 7.0 experiment

on:
  push:
    branches:
      - experiment/adaptive-two-beam-profiles
    paths:
      - ".github/workflows/experimental-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned formatter
        run: |
          python -m pip install ruff==0.17.0
      - name: Format project and commit only if changed
        shell: bash
        run: |
          python -m ruff format .
          if git diff --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply pinned Ruff formatter to adaptive beam experiment"
          git push origin HEAD:refs/heads/experiment/adaptive-two-beam-profiles
