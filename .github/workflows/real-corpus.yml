name: Corpus público real — geometria e ritmo

on:
  pull_request:
    paths:
      - ".github/workflows/real-corpus.yml"
      - "tools/fetch_public_scores.py"
      - "tools/real_staff_baseline.py"
      - "tests/data/real_scores/**"
      - "src/fluteomr/rhythm.py"
      - "src/fluteomr/transcription.py"
      - "src/fluteomr/music.py"
      - "src/fluteomr/musicxml.py"
      - "tools/real_music_probe.py"
      - "tests/test_sixteenths.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-score:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar as dependências do FluteOMR
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Obter partituras publicadas em domínio público
        run: |
          python -m tools.fetch_public_scores \
            --catalog tests/data/real_scores/sources.json \
            --id mutopia-bwv1013 --id mutopia-bwv1031 \
            --out-dir outputs/real_scores
      - name: Baseline solo — BWV 1013 (cinco páginas)
        run: |
          python -m tools.real_staff_baseline \
            outputs/real_scores/mutopia-bwv1013/source.pdf \
            --page 1 --page 2 --page 3 --page 4 --page 5 \
            --dpi 150 --dpi 200 --dpi 300 \
            --report outputs/real_scores/mutopia-bwv1013/geometry.json \
            --preview-dir outputs/real_scores/mutopia-bwv1013/previews
      - name: Baseline multipartes — BWV 1031 (controle negativo)
        run: |
          python -m tools.real_staff_baseline \
            outputs/real_scores/mutopia-bwv1031/source.pdf \
            --page 1 --page 2 \
            --dpi 150 --dpi 200 --dpi 300 \
            --report outputs/real_scores/mutopia-bwv1031/geometry.json \
            --preview-dir outputs/real_scores/mutopia-bwv1031/previews
      - name: A/B exato no PDF publicado — _shape vs prefixos
        run: |
          python -m tools.benchmark_shape \
            outputs/real_scores/mutopia-bwv1013/source.pdf \
            --page 1 --dpi 200 --step 4 --repeats 2 \
            --report outputs/real_scores/mutopia-bwv1013/shape-ab.json
      - name: Diagnóstico musical sem exportação não validada (BWV 1013)
        run: |
          set +e
          python -m cProfile -s cumulative -m tools.real_music_probe \
            outputs/real_scores/mutopia-bwv1013/source.pdf \
            --page 1 --dpi 200 \
            --report outputs/real_scores/mutopia-bwv1013/music-probe.json \
            > outputs/real_scores/mutopia-bwv1013/cpu-profile.txt
          status=$?
          set -e
          echo "=== Diagnóstico musical ==="
          cat outputs/real_scores/mutopia-bwv1013/music-probe.json
          echo "=== Funções de maior tempo cumulativo ==="
          head -n 75 outputs/real_scores/mutopia-bwv1013/cpu-profile.txt
          # 1 = falha de transcrição documentada, não erro da aquisição.
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then exit "$status"; fi
      - name: Baseline padrão — BWV 1013, 150 DPI
        run: |
          python -m tools.real_music_probe \
            outputs/real_scores/mutopia-bwv1013/source.pdf \
            --page 1 --dpi 150 \
            --report outputs/real_scores/mutopia-bwv1013/music-probe-150.json
      - name: Perfil secundário adaptativo EXPERIMENTAL — BWV 1013, 150 DPI
        run: |
          python -m tools.real_music_probe \
            outputs/real_scores/mutopia-bwv1013/source.pdf \
            --page 1 --dpi 150 --adaptive-secondary \
            --report outputs/real_scores/mutopia-bwv1013/adaptive-probe-150.json
      - name: Perfil secundário adaptativo EXPERIMENTAL — BWV 1013, 200 DPI
        run: |
          python -m tools.real_music_probe \
            outputs/real_scores/mutopia-bwv1013/source.pdf \
            --page 1 --dpi 200 --adaptive-secondary \
            --report outputs/real_scores/mutopia-bwv1013/adaptive-probe-200.json
      - name: Comparar cobertura a 150 DPI (mesmo PDF e imagem)
        run: |
          python -m tools.compare_adaptive_probes \
            outputs/real_scores/mutopia-bwv1013/music-probe-150.json \
            outputs/real_scores/mutopia-bwv1013/adaptive-probe-150.json \
            --report outputs/real_scores/mutopia-bwv1013/adaptive-ab-150.json
      - name: Comparar cobertura baseline vs adaptativo (sem precisão musical)
        run: |
          python -m tools.compare_adaptive_probes \
            outputs/real_scores/mutopia-bwv1013/music-probe.json \
            outputs/real_scores/mutopia-bwv1013/adaptive-probe-200.json \
            --report outputs/real_scores/mutopia-bwv1013/adaptive-ab-200.json
      - name: Preservar PDFs publicados e evidências privadas temporárias
        # Upload experimental opcional. O serviço de artefatos falhou na
        # finalização apesar de todos os relatórios serem gerados com sucesso.
        # Evita bloquear o PR por um erro externo e demorado de armazenamento.
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: public-domain-flute-scores-geometry
          path: outputs/real_scores/
          retention-days: 7
          if-no-files-found: warn
