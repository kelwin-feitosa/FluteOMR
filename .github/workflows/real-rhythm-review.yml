name: Revisão humana de ritmos inconclusivos (corpus público)

on:
  pull_request:
    paths:
      - ".github/workflows/real-rhythm-review.yml"
      - "tools/prepare_rhythm_review.py"
      - "tests/test_prepare_rhythm_review.py"
      - "src/fluteomr/rhythm.py"
      - "tools/fetch_public_scores.py"
      - "tests/data/real_scores/sources.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-packet:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Preparar ambiente offline do motor Python
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Baixar PDF publicado com SHA-256 conhecido
        run: |
          python -m tools.fetch_public_scores \
            --catalog tests/data/real_scores/sources.json \
            --id mutopia-bwv1013 \
            --out-dir outputs/real_scores
      - name: Preparar até 12 recortes com campos humanos em branco
        run: |
          python -m tools.prepare_rhythm_review \
            outputs/real_scores/mutopia-bwv1013/source.pdf \
            --page 1 --dpi 200 --max-cases 12 \
            --out-dir outputs/rhythm_review
      - name: Arquivos de revisão (não são ground truth)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bwv1013-rhythm-review-unreviewed
          path: outputs/rhythm_review/
          retention-days: 7
          if-no-files-found: warn
