[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fluteomr"
version = "0.1.0"
description = "Núcleo próprio de reconhecimento óptico de partituras para flauta transversal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["Pillow==13.0.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]
pdf = ["pypdfium2==5.15.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
